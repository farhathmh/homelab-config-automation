#cloud-config
# ==============================================================================
# Minimal First-Boot Bootstrap — Instance Layer
# ==============================================================================
# Uploaded via proxmox_virtual_environment_file and wired into every cloned
# node's user_data_file_id (see terraform/instances/main.tf). Its only job is
# to get the box reachable for Ansible: qemu-guest-agent (already enabled by
# the `agent` block, this ensures the package exists) + python3 (Ansible's
# managed-node requirement).
#
# Nothing role-specific belongs here. Users, packages, services, MOTDs, and
# anything else distro- or role-specific belongs in an Ansible role instead —
# see CLAUDE.md's "Known gaps" note on why an earlier attempt at a fuller
# snippet (erenyx-base.yaml) was reverted.
# ==============================================================================

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - python3

runcmd:
  - systemctl enable --now qemu-guest-agent
