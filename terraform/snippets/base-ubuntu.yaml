#cloud-config
# ==============================================================================
# Ubuntu 24.04 LTS Cloud-Init Baseline Configuration
# ==============================================================================
# Injected into cloned Ubuntu VMs at first boot. Conforms to cloud-init.io schema.
# ==============================================================================

# Ensure hostname set in Proxmox VM config is applied
preserve_hostname: false

# System package index update
package_update: true
package_upgrade: false

# Core baseline packages required for management and hypervisor integration
packages:
  - qemu-guest-agent
  - curl
  - htop
  - ca-certificates
  - vim
  - git

# First-boot commands executed by Cloud-Init
runcmd:
  # Ensure QEMU Guest Agent starts immediately for Proxmox IP discovery & clean shutdown
  - systemctl enable --now qemu-guest-agent

# Final boot summary output
final_message: "The system is finally up, after $UPTIME seconds"
