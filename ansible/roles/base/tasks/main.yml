---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - tmux
      - htop
      - qemu-guest-agent
      - toilet
      - toilet-fonts
      - figlet
    state: present
    update_cache: true

- name: Ensure qemu-guest-agent is enabled and running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

# The Erenyx-Lab + hostname banners are identical in structure across every
# node (only the hostname text differs), so this is rendered once here, not
# per-role. It's deployed as an /etc/update-motd.d/ script (not a static
# /etc/motd template): PAM shows /run/motd.dynamic (populated by
# update-motd.d, run in filename order) BEFORE /etc/motd, always — a static
# /etc/motd can never come first regardless of its content. 00-erenyx-banner
# sorts ahead of every stock script there (00-header included), which is
# what actually puts it in the first block. See
# ansible/roles/base/files/00-erenyx-banner for the render/centering logic.
#
# toilet is figlet-format compatible and reads /usr/share/figlet/ for
# fonts, but "slant"/"digital" are part of figlet's own bundled default
# font set, not toilet-fonts (which ships a distinct, differently-named
# set — ascii12, wideterm, pagga, etc.). figlet is installed above purely
# as a font-file source for these two names; toilet remains the only
# binary actually invoked.
- name: Ensure /etc/motd carries no stale static content
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

- name: Deploy Erenyx-Lab MOTD banner script
  ansible.builtin.copy:
    src: 00-erenyx-banner
    dest: /etc/update-motd.d/00-erenyx-banner
    owner: root
    group: root
    mode: "0755"

# Drops just the welcome header ("Welcome to Ubuntu...") and the
# Documentation/Management/Support links block — run-parts (which builds
# /run/motd.dynamic) skips non-executable files, so removing the execute
# bit is enough; the scripts themselves stay untouched/package-managed.
# 50-landscape-sysinfo (System information as of...) and everything else
# in update-motd.d is left alone, per the owner's request to keep sysinfo.
- name: Disable stock Ubuntu welcome/help-text MOTD blocks
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 00-header
    - 10-help-text
