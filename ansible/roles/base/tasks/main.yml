---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - tmux
      - htop
      - qemu-guest-agent
      - toilet
      - toilet-fonts
    state: present
    update_cache: true

- name: Ensure qemu-guest-agent is enabled and running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

# MOTD is rendered once here (not per-role) since it's identical in
# structure across every node — only the hostname banner differs. The
# Erenyx-Lab banner is constant; role identity isn't shown at all anymore
# (dropped by request in favor of just the two banners).
#
# LANG/LC_ALL are pinned explicitly: toilet needs a UTF-8 locale to load its
# fonts, but Ubuntu's default sudoers has `Defaults env_reset`, which strips
# LANG/LC_* from become's environment — so the exact same command that works
# in an interactive SSH shell fails here with "could not load font slant"
# unless the locale is set back explicitly. C.UTF-8 is used because it's
# built into glibc on Ubuntu by default (no locale-gen required), unlike
# en_US.UTF-8.
- name: Render Erenyx-Lab banner
  ansible.builtin.command: toilet -F border -F gay -f slant -k "Erenyx-Lab"
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  register: erenyx_banner
  changed_when: false

- name: Render hostname banner
  ansible.builtin.command: toilet -F metal -f digital "{{ inventory_hostname }}"
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  register: hostname_banner
  changed_when: false

- name: Deploy MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
